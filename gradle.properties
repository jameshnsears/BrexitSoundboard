# --- Performance & Parallelism ---
org.gradle.daemon=true
org.gradle.parallel=true
# Gradle 9+ handles caching and configuration much more efficiently
org.gradle.caching=true
org.gradle.configuration-cache=true
# Note: Configure-on-demand is largely superseded by Configuration Cache
org.gradle.configureondemand=false
# --- Memory Management (Optimized for 16GB RAM) ---
# 4GB-6GB is the sweet spot. 8GB+ often leads to long GC pauses.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
# --- Android Modernization ---
android.useAndroidX=true
# Jetifier is a massive performance sink. Set to false unless using very old libs.
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# --- Kotlin & Kapt ---
kapt.incremental.apt=true
# If using KSP, you can often disable kapt entirely
kapt.use.worker.api=true
# --- Gradle 9 / Future Proofing ---
# Isolated projects is often incompatible with many plugins (including Crashlytics)
org.gradle.unsafe.isolated-projects=false
android.lint.checkDependencies=false
